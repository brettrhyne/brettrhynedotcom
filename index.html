<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brett Rhyne</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #fff0f5;
            --surface: #ffffff;
            --border: #f0c0d0;
            --text: #4a2040;
            --text-muted: #9a6080;
            --accent: #e84393;
            --accent-hover: #fd79a8;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        main {
            text-align: center;
            padding: 2rem;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 0.5rem;
        }
        p {
            color: var(--text-muted);
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        a.card {
            display: block;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem 2.5rem;
            text-decoration: none;
            color: var(--text);
            transition: border-color 0.2s, transform 0.2s;
        }
        a.card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        a.card h2 {
            color: var(--accent);
            margin-bottom: 0.25rem;
        }
        a.card span {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        .sparkle {
            position: fixed;
            pointer-events: none;
            font-size: 24px;
            z-index: 9999;
            animation: sparkle-fall linear forwards;
        }
        @keyframes sparkle-fall {
            0% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
            100% { opacity: 0; transform: translateY(120px) rotate(360deg) scale(0); }
        }
    </style>
</head>
<body>
    <main>
        <h1>Brett Rhyne</h1>
        <p>Welcome to my site.</p>
        <div class="links">
            <a class="card" href="/python/">
                <h2>Learn Python</h2>
                <span>Interactive shell & practice problems</span>
            </a>
        </div>
    </main>
    <script>
        const flowerChars = ["\uD83E\uDD95", "\uD83E\uDD96", "\uD83E\uDD8E"];
        let flowerTimer = 0;
        document.addEventListener("mousemove", (e) => {
            const now = Date.now();
            if (now - flowerTimer > 80) {
                flowerTimer = now;
                const el = document.createElement("span");
                el.className = "sparkle";
                el.textContent = flowerChars[Math.floor(Math.random() * flowerChars.length)];
                el.style.left = (e.clientX + (Math.random() - 0.5) * 30) + "px";
                el.style.top = (e.clientY + (Math.random() - 0.5) * 30) + "px";
                el.style.animationDuration = (1 + Math.random() * 1.5) + "s";
                document.body.appendChild(el);
                el.addEventListener("animationend", () => el.remove());
            }
        });
    </script>
</body>
</html>
